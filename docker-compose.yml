services:
  aws-emulator:
    image: aws-emulator:latest
    container_name: aws-emulator
    ports:
      - "127.0.0.1:9297:9297"
    volumes:
      - emulator-share:/home/emulator/.aws/emulator
    command: ["-p", "9297", "-b", "0.0.0.0", "--telemetry", "off"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -s /home/emulator/.aws/emulator/9297/ca.pem"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 2s

  console-ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: aws-emulator-ui:latest
    container_name: aws-emulator-ui
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - AWS_ENDPOINT_URL=https://aws-emulator:9297
      - AWS_EMULATOR_SHARE=/root/.aws/emulator
      - EMULATOR_PORT=9297
      - AWS_REGION=us-east-1
      - AWS_EC2_METADATA_DISABLED=true
      - DOCKER_CMD=docker
    volumes:
      - emulator-share:/root/.aws/emulator:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      aws-emulator:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/api/health 2>/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  emulator-share:
    name: aws_emulator_share
